packages:
  - "apps/*"
  - "packages/*"

# Tat private hoist (node_modules/.pnpm/node_modules): moi app chi thay dung
# dependency no khai bao, khong an nham type/package cua app khac trong workspace
# (tung lam tsc bao "cannot be used as a JSX component" khi hai app lech ban React).
hoist: false

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
