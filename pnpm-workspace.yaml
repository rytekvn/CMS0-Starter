packages:
  - "apps/*"
  - "packages/*"

# Tat private hoist (node_modules/.pnpm/node_modules). Co hoist thi @types/react 19
# cua apps/admin-web bi react-router-dom cua admin-web-legacy (React 18) nhin thay
# -> tsc bao "cannot be used as a JSX component". Tat di, moi app chi thay dung
# dependency no khai bao.
hoist: false

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
